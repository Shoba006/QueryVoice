services:
  - type: web
    name: queryvoice-rag
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEFAULT_CHUNK_STRATEGY
        value: semantic
